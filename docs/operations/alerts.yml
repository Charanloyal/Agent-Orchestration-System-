# Prometheus alert rules for the Agent Orchestration System pilot (ADR 0016).
# Scrape: GET /metrics with `Authorization: Bearer $AOS_METRICS_TOKEN`.
# Thresholds are starting points for a small pilot; tune them against observed baselines.
groups:
  - name: aos-availability
    rules:
      - alert: AosApiDown
        expr: up{job="aos-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: API is not answering scrapes
          runbook: docs/operations/runbook.md#api-down

      - alert: AosHighErrorRate
        expr: |
          sum(rate(aos_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(aos_http_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: page }
        annotations:
          summary: More than 5% of API requests fail with 5xx
          runbook: docs/operations/runbook.md#api-errors

      - alert: AosSlowApi
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(aos_http_request_duration_seconds_bucket{route!="/api/v1/runs/{run_id}/events"}[10m]))) > 1
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: p95 API latency above 1 s (excluding the SSE stream)
          runbook: docs/operations/runbook.md#api-errors

  - name: aos-workers
    rules:
      - alert: AosWorkerStalled
        expr: aos_jobs_expired_leases > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: Leased jobs whose lease expired and were not taken over
          runbook: docs/operations/runbook.md#worker-down-or-stalled

      - alert: AosQueueBacklog
        expr: aos_jobs_oldest_queued_seconds > 300
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: A runnable job has waited more than 5 minutes for a worker
          runbook: docs/operations/runbook.md#worker-down-or-stalled

      - alert: AosRunsFailing
        expr: delta(aos_runs{state="FAILED"}[1h]) > 3
        labels: { severity: ticket }
        annotations:
          summary: More than 3 runs failed in the last hour
          runbook: docs/operations/runbook.md#runs-failing

  - name: aos-cost-and-humans
    rules:
      - alert: AosUncertainSpendGrowing
        expr: increase(aos_budget_uncertain_usd_total[1h]) > 0.10
        labels: { severity: ticket }
        annotations:
          summary: More than $0.10 of possibly-billed, unconfirmed spend in an hour
          runbook: docs/operations/runbook.md#provider-outage

      - alert: AosSpendCeilingApproaching
        expr: aos_budget_committed_usd_total > 8
        labels: { severity: page }
        annotations:
          summary: Estimated committed spend passed $8 of the $10 project ceiling (ADR 0005)
          runbook: docs/operations/runbook.md#spend-ceiling

      - alert: AosApprovalsAboutToExpire
        expr: aos_approvals_seconds_to_first_expiry < 6 * 3600
        labels: { severity: ticket }
        annotations:
          summary: A plan or report approval expires within 6 hours
          runbook: docs/operations/runbook.md#approval-backlog
