# Render Blueprint for the Agent Orchestration System (ADR 0018, docs/operations/deploy-render.md).
#
# Topology: one Docker web service (API + built SPA on one origin), one Docker background
# worker built from the same image, one managed Postgres. Render background workers and
# pre-deploy commands require paid instance types, so this blueprint is not free-tier; see
# render.hybrid.yaml and render.free.yaml for the single-service variants (ADR 0022, 0023).
#
# Secrets are `sync: false`: Render prompts for them when the Blueprint is first created and
# never reads them from this file. Nothing secret is committed here.
#
# This deployment runs the deterministic fake agents by default (AOS_AGENT_MODE=fake): it
# demonstrates the workflow, it is NOT evidence of real-model quality.

databases:
  - name: aos-db
    databaseName: aos
    user: aos
    plan: basic-256mb
    postgresMajorVersion: "17"
    region: singapore
    ipAllowList: []   # no public access; services connect over Render's private network

envVarGroups:
  - name: aos-shared
    envVars:
      - key: AOS_ENV
        value: prod
      - key: AOS_LOG_JSON
        value: "true"
      - key: AOS_COOKIE_SECURE
        value: "true"
      - key: AOS_AGENT_MODE
        value: fake
      - key: AOS_SEARCH_PROVIDER
        value: fake
      # Render's disks are ephemeral and per service, and nothing reads a stored copy back:
      # uploads live on as extracted text, exports are rendered on download (ADR 0026).
      - key: AOS_STORE_FILES
        value: "false"
      # 0 keeps finished runs and uploads until someone deletes them (the demo must last until
      # the viva; docs/operations/data-retention.md). Set days here to turn the sweep on.
      - key: AOS_RETENTION_RUN_DAYS
        value: "0"
      - key: AOS_RETENTION_UPLOAD_DAYS
        value: "0"
      # Access model (ADR 0021): visitors can ask for access from the sign-in page; a platform
      # admin approves. Use "invite" to accept invited people only.
      - key: AOS_SIGNUP_MODE
        value: request

services:
  - type: web
    name: aos-web
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    preDeployCommand: alembic upgrade head
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: aos-shared
      # Render's proxies append three X-Forwarded-For entries; the client is the third from the
      # right (measured 2026-11-12 with /network-check, ADR 0025).
      - key: AOS_TRUSTED_PROXY_HOPS
        value: "3"
      - key: AOS_DATABASE_URL
        fromDatabase:
          name: aos-db
          property: connectionString
      # The public URL is Render's RENDER_EXTERNAL_URL (https://aos-web-xxxx.onrender.com),
      # registered at the identity provider as <url>/api/v1/auth/callback. Set AOS_PUBLIC_URL
      # in the Dashboard only for a custom domain.
      # A real OpenID Connect provider (Google, Microsoft Entra ID, Auth0, Keycloak...).
      # The bundled dev issuer is refused in prod by configuration validation.
      - key: AOS_OIDC_ISSUER
        sync: false
      - key: AOS_OIDC_CLIENT_ID
        sync: false
      - key: AOS_OIDC_CLIENT_SECRET
        sync: false
      # Who manages access for the whole deployment (required in prod), e.g. "you@gmail.com".
      # Optional extras, set in the Dashboard if wanted: AOS_ALLOWED_EMAILS and
      # AOS_ALLOWED_EMAIL_DOMAINS (always allowed to sign in).
      - key: AOS_PLATFORM_ADMIN_EMAILS
        sync: false
      - key: AOS_METRICS_TOKEN
        generateValue: true
      # Encrypts model keys saved in workspace settings (ADR 0029); generated once by Render.
      - key: AOS_SECRETS_KEY
        generateValue: true

  - type: worker
    name: aos-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.workers.runner
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: aos-shared
      - key: AOS_DATABASE_URL
        fromDatabase:
          name: aos-db
          property: connectionString
      # The worker serves no HTTP, so it needs no sign-in, cookie or public URL settings
      # (ADR 0023). Add the AOS_LLM_* variables here too if AOS_AGENT_MODE=llm.
      # It decrypts the model keys that workspace admins save (ADR 0029) with the web's secret.
      - key: AOS_SECRETS_KEY
        fromService:
          type: web
          name: aos-web
          envVarKey: AOS_SECRETS_KEY
