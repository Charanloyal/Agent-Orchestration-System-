name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: aos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AOS_TEST_DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/aos_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app devtools evaluation tests scripts migrations/env.py
          ruff format --check app devtools evaluation tests scripts migrations/env.py
      - name: Type-check
        run: mypy
      - name: Tests (contracts, schema drift, migrations, authz, OIDC)
        run: pytest -q

  spike:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: aos_spike
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AOS_SPIKE_DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/aos_spike
    defaults:
      run:
        working-directory: spikes/week2_persistence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: spikes/week2_persistence/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lockfile must only reference the public registry
        run: "! grep -n 'localhost' package-lock.json"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: aos_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AOS_E2E_DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/aos_e2e
      PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end tests (dev IdP, API, worker, web, Postgres)
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-ephemeral
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build

  # The single-origin image deployed to Render (ADR 0018), smoke-tested with production
  # settings against a real Postgres: migrate, start web + worker, probe the public surface.
  deploy-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: aos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Validate render.yaml and render.free.yaml against Render's published Blueprint schema
        run: |
          python -m pip install --quiet jsonschema pyyaml
          curl -fsSL https://render.com/schema/render.yaml.json -o "$RUNNER_TEMP/render.schema.json"
          python - <<'EOF'
          import json, os, sys, jsonschema, yaml
          schema = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "render.schema.json")))
          failed = False
          for name in ("render.yaml", "render.free.yaml"):
              errors = list(jsonschema.Draft7Validator(schema).iter_errors(yaml.safe_load(open(name))))
              for e in errors:
                  print(f"{name}:", "/".join(map(str, e.path)), e.message[:300])
              failed = failed or bool(errors)
          sys.exit(1 if failed else 0)
          EOF
      - name: Build the production image
        run: docker build -t aos:ci .
      - name: Migrate, start web and worker, smoke test
        run: |
          set -eu
          ENVS="-e AOS_ENV=prod -e AOS_DATABASE_URL=postgresql://postgres:ci-only-ephemeral@127.0.0.1:5432/aos \
            -e AOS_COOKIE_SECURE=true -e AOS_PUBLIC_URL=https://aos.example.org \
            -e AOS_OIDC_ISSUER=https://login.example.org -e AOS_OIDC_CLIENT_ID=ci-client \
            -e AOS_ALLOWED_EMAIL_DOMAINS=example.org \
            -e AOS_BUILD_COMMIT=${GITHUB_SHA}"
          docker run --rm --network host $ENVS aos:ci alembic upgrade head
          docker run -d --name web --network host $ENVS -e PORT=10000 aos:ci
          docker run -d --name worker --network host $ENVS aos:ci python -m app.workers.runner
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:10000/readyz && break; sleep 2; done
          python backend/scripts/smoke_prod.py http://127.0.0.1:10000 --allow-http --idp-unreachable \
            --expect-commit "${GITHUB_SHA}" --expect-signup-mode invite
          if docker exec web test -e /srv/backend/devtools; then echo "dev issuer shipped"; exit 1; fi
          docker exec web python -c "from app.storage import get_object_store as s; s().put('ci/probe.txt', b'ok'); assert s().get('ci/probe.txt') == b'ok' and s().exists('ci/probe.txt')"
          sleep 5
          docker logs worker 2>&1 | grep -q '"worker started"'
          if docker logs web 2>&1 | grep -q 'ci-only-ephemeral'; then echo "secret in logs"; exit 1; fi
          if docker logs worker 2>&1 | grep -q 'ci-only-ephemeral'; then echo "secret in logs"; exit 1; fi
          docker stop -t 30 worker
          docker logs worker 2>&1 | grep -q '"worker stopped"'
          docker stop -t 30 web
      - name: Single-service variant (render.free.yaml) migrates, runs the worker and serves
        run: |
          set -eu
          ENVS="-e AOS_ENV=prod -e AOS_DATABASE_URL=postgresql://postgres:ci-only-ephemeral@127.0.0.1:5432/aos \
            -e AOS_COOKIE_SECURE=true -e AOS_PUBLIC_URL=https://aos.example.org \
            -e AOS_OIDC_ISSUER=https://login.example.org -e AOS_OIDC_CLIENT_ID=ci-client \
            -e AOS_ALLOWED_EMAIL_DOMAINS=example.org"
          docker run -d --name single --network host $ENVS -e PORT=10001 aos:ci \
            python -m app.serve --migrate --with-worker
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:10001/readyz && break; sleep 2; done
          python backend/scripts/smoke_prod.py http://127.0.0.1:10001 --allow-http --idp-unreachable
          sleep 5
          docker logs single 2>&1 | grep -q '"worker started"'
          docker stop -t 30 single
          docker logs single 2>&1 | grep -q '"worker stopped"'
      - if: always()
        name: Container logs
        run: |
          docker logs web || true
          docker logs worker || true
          docker logs single || true
