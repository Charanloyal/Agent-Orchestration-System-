name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: aos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AOS_TEST_DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/aos_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app devtools evaluation tests scripts migrations/env.py
          ruff format --check app devtools evaluation tests scripts migrations/env.py
      - name: Type-check
        run: mypy
      - name: Tests (contracts, schema drift, migrations, authz, OIDC)
        run: pytest -q

  spike:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: aos_spike
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AOS_SPIKE_DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/aos_spike
    defaults:
      run:
        working-directory: spikes/week2_persistence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: spikes/week2_persistence/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lockfile must only reference the public registry
        run: "! grep -n 'localhost' package-lock.json"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: aos_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AOS_E2E_DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/aos_e2e
      PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end tests (dev IdP, API, worker, web, Postgres)
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-ephemeral
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build

  # Proves the image can be deployed (ADR 0018, 0020, 0023): every blueprint is valid and starts
  # the image the way this job does; each topology starts with production settings against a
  # real Postgres and passes scripts/smoke_prod.py; the build before the newest migration stays
  # ready on the new schema, so rolling back needs no schema change.
  deploy-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: aos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_ROOT: postgresql://postgres:ci-only-ephemeral@127.0.0.1:5432
      # The image's own HEALTHCHECK command, run often so CI need not wait 30 s (G4).
      HC: --health-interval=3s --health-start-period=0s --health-retries=3
      # Settings only the web service needs. The worker and the migration get database settings only.
      WEB_ENVS: >-
        -e AOS_COOKIE_SECURE=true -e AOS_PUBLIC_URL=https://aos.example.org
        -e AOS_OIDC_ISSUER=https://login.example.org -e AOS_OIDC_CLIENT_ID=ci-client
        -e AOS_PLATFORM_ADMIN_EMAILS=ops@example.org -e AOS_SIGNUP_MODE=request
        -e AOS_STORE_FILES=false -e AOS_TRUSTED_PROXY_HOPS=1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the older-build check builds an earlier commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Validate every render*.yaml (Render's published schema; starts the image as this job does)
        run: |
          python -m pip install --quiet jsonschema pyyaml
          curl -fsSL https://render.com/schema/render.yaml.json -o "$RUNNER_TEMP/render.schema.json"
          python backend/scripts/check_blueprints.py --schema "$RUNNER_TEMP/render.schema.json"
      - name: Build the production image
        run: docker build -t aos:ci .
      - name: Health-check helper
        run: |
          cat > "$RUNNER_TEMP/healthy.sh" <<'EOF'
          # $1 container, $2 the roles its HEALTHCHECK must find ("web ok", "worker ok", both).
          for i in $(seq 1 20); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$1")
            if [ "$s" = healthy ]; then
              found=$(docker exec "$1" python -m app.healthcheck)
              if [ "$found" = "$2" ]; then echo "$1 healthy: $found"; exit 0; fi
              echo "$1 healthy but found '$found', expected '$2'"; exit 1
            fi
            sleep 2
          done
          echo "$1 is $s"; docker inspect -f '{{json .State.Health.Log}}' "$1"; exit 1
          EOF
      - name: "Web + worker (render.yaml): pre-deploy migration, web, worker without web settings"
        run: |
          set -eu
          DB="-e AOS_ENV=prod -e AOS_DATABASE_URL=$DB_ROOT/aos"
          docker run --rm --network host $DB aos:ci alembic upgrade head
          docker run -d --name web --network host $DB $WEB_ENVS $HC -e AOS_BUILD_COMMIT="$GITHUB_SHA" -e PORT=10000 aos:ci
          # Host networking shares ports: the worker's health check gets a port nothing listens on,
          # so it can only pass on the worker's own signal, as on Render.
          docker run -d --name worker --network host $DB $HC -e PORT=10099 aos:ci python -m app.workers.runner
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:10000/readyz && break; sleep 2; done
          python backend/scripts/smoke_prod.py http://127.0.0.1:10000 --allow-http --idp-unreachable \
            --expect-commit "$GITHUB_SHA" --expect-signup-mode request
          if docker exec web test -e /srv/backend/devtools; then echo "dev issuer shipped"; exit 1; fi
          # The image's object store directory is writable, and with Render's AOS_STORE_FILES=false
          # the app keeps no copies there (ADR 0026).
          docker exec web python -c "from app.config import get_settings as g; from app.storage import LocalObjectStore as L, get_object_store as s; d = L(g().object_store_dir); d.put('ci/probe.txt', b'ok'); assert d.get('ci/probe.txt') == b'ok' and not s().keeps_files"
          sleep 5
          docker logs worker 2>&1 | grep -q '"worker started"'
          sh "$RUNNER_TEMP/healthy.sh" web "web ok"
          sh "$RUNNER_TEMP/healthy.sh" worker "worker ok"
          for c in web worker; do
            if docker logs "$c" 2>&1 | grep -q 'ci-only-ephemeral'; then echo "secret in $c logs"; exit 1; fi
          done
          docker stop -t 30 worker
          docker logs worker 2>&1 | grep -q '"worker stopped"'
          docker stop -t 30 web
      - name: "Single process (render.hybrid.yaml, render.free.yaml): fresh database, migrate on start, worker"
        run: |
          set -eu
          docker run --rm --network host aos:ci python -c \
            "import psycopg; psycopg.connect('$DB_ROOT/postgres', autocommit=True).execute('CREATE DATABASE aos_single')"
          docker run -d --name single --network host -e AOS_ENV=prod -e AOS_DATABASE_URL="$DB_ROOT/aos_single" \
            $WEB_ENVS $HC -e AOS_BUILD_COMMIT="$GITHUB_SHA" -e PORT=10001 aos:ci python -m app.serve --migrate --with-worker
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:10001/readyz && break; sleep 2; done
          python backend/scripts/smoke_prod.py http://127.0.0.1:10001 --allow-http --idp-unreachable \
            --expect-commit "$GITHUB_SHA" --expect-signup-mode request
          sleep 5
          docker logs single 2>&1 | grep -q '"worker started"'
          sh "$RUNNER_TEMP/healthy.sh" single "web ok, worker ok"
          docker stop -t 30 single
          docker logs single 2>&1 | grep -q '"worker stopped"'
      - name: Older build stays ready on the new schema (ADR 0020)
        run: |
          set -eu
          newest=$(ls backend/migrations/versions | grep -E '^[0-9]{4}_.*\.py$' | sort | tail -n 1)
          added=$(git log --diff-filter=A --format=%H -n 1 -- "backend/migrations/versions/$newest")
          prev=$(git rev-parse "$added^")
          echo "Newest migration $newest was added in ${added:0:12}; older build: ${prev:0:12}"
          git worktree add --detach "$RUNNER_TEMP/prev" "$prev"
          docker build -t aos:prev "$RUNNER_TEMP/prev"
          # The older build may need its own settings (the 0009 build requires an allowlist and
          # validates web settings in its worker); newer builds ignore unknown variables.
          OLD="-e AOS_ENV=prod -e AOS_DATABASE_URL=$DB_ROOT/aos $WEB_ENVS -e AOS_ALLOWED_EMAIL_DOMAINS=example.org"
          docker run -d --name prev-web --network host $OLD -e AOS_BUILD_COMMIT="$prev" -e PORT=10002 aos:prev
          docker run -d --name prev-worker --network host $OLD aos:prev python -m app.workers.runner
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:10002/readyz && break; sleep 2; done
          python backend/scripts/smoke_prod.py http://127.0.0.1:10002 --allow-http --idp-unreachable \
            --expect-commit "$prev"
          sleep 5
          docker logs prev-worker 2>&1 | grep -q '"worker started"'
          docker stop -t 30 prev-worker prev-web
      - if: always()
        name: Container logs
        run: |
          for c in web worker single prev-web prev-worker; do
            echo "::group::$c"; docker logs "$c" 2>&1 || true; echo "::endgroup::"
          done
