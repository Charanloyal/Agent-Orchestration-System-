# Serves the built SPA and proxies the API on the same origin (no CORS, cookies stay first-party).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events: no buffering, long-lived connections.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(health|healthz|readyz)$ {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
