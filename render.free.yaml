# Free-plan Render Blueprint (ADR 0022, docs/operations/deploy-render.md): ONE web service that
# migrates on start and runs the workflow worker as a supervised child process
# (`python -m app.serve --migrate --with-worker`), plus a free Postgres.
#
# Trade-offs compared with render.yaml (the recommended, paid topology):
# - free web services sleep when idle; the first request after a pause is slow, and queued
#   runs continue only once the service is awake;
# - Render's free Postgres is time-limited; check Render's current free-tier terms;
# - API and worker share one small instance.
#
# Secrets are `sync: false`: Render prompts for them when the Blueprint is created. Nothing
# secret is committed here. Demo agents only (AOS_AGENT_MODE=fake).

databases:
  - name: aos-db
    databaseName: aos
    user: aos
    plan: free
    postgresMajorVersion: "17"
    region: singapore
    ipAllowList: []   # no public access; the service connects over Render's private network

services:
  - type: web
    name: aos-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.serve --migrate --with-worker
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    envVars:
      - key: AOS_ENV
        value: prod
      - key: AOS_LOG_JSON
        value: "true"
      - key: AOS_COOKIE_SECURE
        value: "true"
      - key: AOS_AGENT_MODE
        value: fake
      - key: AOS_SEARCH_PROVIDER
        value: fake
      - key: AOS_RETENTION_RUN_DAYS
        value: "30"
      - key: AOS_RETENTION_UPLOAD_DAYS
        value: "30"
      - key: AOS_SIGNUP_MODE
        value: request
      # Render's proxy appends the client address to X-Forwarded-For (ADR 0025).
      - key: AOS_TRUSTED_PROXY_HOPS
        value: "1"
      - key: AOS_DATABASE_URL
        fromDatabase:
          name: aos-db
          property: connectionString
      # The service's own https URL, e.g. https://aos-web-xxxx.onrender.com (registered at the
      # identity provider as <url>/api/v1/auth/callback).
      - key: AOS_PUBLIC_URL
        sync: false
      - key: AOS_OIDC_ISSUER
        sync: false
      - key: AOS_OIDC_CLIENT_ID
        sync: false
      - key: AOS_OIDC_CLIENT_SECRET
        sync: false
      - key: AOS_PLATFORM_ADMIN_EMAILS
        sync: false
      - key: AOS_METRICS_TOKEN
        generateValue: true
