[tool.pytest.ini_options]
pythonpath = [".", "../../backend"]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:langsmith_plugin -p no:cacheprovider"
filterwarnings = [
    "error",
    # Upstream langsmith (transitive via langchain-core) on Python 3.14; not spike code.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
